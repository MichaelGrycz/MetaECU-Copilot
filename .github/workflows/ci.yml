name: MetaECU Copilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Binary Core Unit Tests (17/17 checks)
      run: |
        python backend/binary_core/test_binary_core.py

    - name: Run End-to-End Safety Gate & Self-Correction Tests
      run: |
        python backend/test_end_to_end.py

    - name: Smoke Test Web API & Endpoints
      run: |
        python -c "from fastapi.testclient import TestClient; from backend.web_app import app; c = TestClient(app); assert c.get('/').status_code == 200; assert c.get('/api/meta').status_code == 200"
